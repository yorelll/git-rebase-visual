name: Release VSIX

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Package and publish VSIX
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches extension version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          test "$tag_version" = "$package_version" || {
            echo "Tag version ($tag_version) does not match package.json ($package_version)."
            exit 1
          }

      - name: Run type checks and logic, boundary, and Git integration tests
        run: npm run test:release

      - name: Build and package VSIX
        run: npm run package

      - name: Verify packaged VSIX
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          # `npm run package` writes into dist-vsix/ so build output never litters
          # the repository root.
          vsix="dist-vsix/git-rebase-visual-$version.vsix"
          test -f "$vsix"

          # The allowlist lives in exactly one place: `expectedEntries` in
          # scripts/package-vsix.js. An earlier version of this step repeated the
          # 12-entry list in a heredoc, so shipping a file meant editing the same
          # list twice and a half-edit failed here rather than at the source.
          # `--verify-only` re-runs that single check against the artifact the
          # previous step produced, without rebuilding it.
          node scripts/package-vsix.js --verify-only

      - name: Verify final release body
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="docs/release-notes/$version.md"
          test -s "$notes"
          grep -Fq "## Git Rebase Visual $version" "$notes"
          ! grep -Eq '{{[A-Z_]+}}' "$notes"
          grep -q -- "**$version**" RELEASE.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Git Rebase Visual v$version" \
            --notes-file "docs/release-notes/$version.md" \
            "dist-vsix/git-rebase-visual-$version.vsix#Git Rebase Visual v$version"
