name: Release VSIX

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Package and publish VSIX
    runs-on: ubuntu-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches extension version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          test "$tag_version" = "$package_version" || {
            echo "Tag version ($tag_version) does not match package.json ($package_version)."
            exit 1
          }

      - name: Run type checks and logic, boundary, and Git integration tests
        run: npm run test:release

      - name: Build and package VSIX
        run: npm run package

      - name: Verify packaged VSIX
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -f "git-rebase-visual-$version.vsix"
          unzip -l "git-rebase-visual-$version.vsix" | grep -q 'extension/dist/extension.js'
          unzip -l "git-rebase-visual-$version.vsix" | grep -q 'extension/dist/seq-editor.js'
          unzip -l "git-rebase-visual-$version.vsix" | grep -q 'extension/media/main.js'
          unzip -l "git-rebase-visual-$version.vsix" | grep -q 'extension/package.json'
          ! unzip -l "git-rebase-visual-$version.vsix" | grep -q 'extension/src/'
          ! unzip -l "git-rebase-visual-$version.vsix" | grep -q 'extension/test/'
          ! unzip -l "git-rebase-visual-$version.vsix" | grep -q 'extension/docs/'
          ! unzip -l "git-rebase-visual-$version.vsix" | grep -q 'extension/node_modules/'

      - name: Check release notes are documented
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q -- "**$version**" RELEASE.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Git Rebase Visual v$version" \
            --generate-notes \
            "git-rebase-visual-$version.vsix#Git Rebase Visual v$version"
